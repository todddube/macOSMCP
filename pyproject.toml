[project]
name = "macos-mcp"
version = "0.2.0"
description = "macOS Apps MCP Server — Reminders (read-only), Calendar & Mail coming soon"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
]

[project.scripts]
macos-mcp = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
