[project]
name = "mac-bridge"
version = "0.5.1"
description = "mac-bridge — MCP server bridging Claude to macOS Reminders, Calendar & iMessage"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.1.1",
]

[project.scripts]
mac-bridge = "server:mcp.run"
mac-bridge-dashboard = "dashboard:main"

[project.optional-dependencies]
agent = [
    "anthropic>=0.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["macos_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
