[project]
name = "mac-bridge"
version = "0.4.0"
description = "mac-bridge — MCP server bridging Claude to macOS Reminders & Calendar (read-only), Mail coming soon"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
]

[project.scripts]
mac-bridge = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["macos_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
